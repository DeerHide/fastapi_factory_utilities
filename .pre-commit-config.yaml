default_language_version:
  python: python3.12
default_stages:
  - "pre-push"
  - "pre-commit"
  - "manual"
repos:
  - repo: local
    hooks:
      - id: poetry lock check
        name: poetry lock check
        entry: bash
        args: ["-c", "poetry check --lock"]
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages:
          - "pre-push"
          - "manual"
      - id: pytest
        name: pytest
        entry: "./.venv/bin/pytest"
        args:
          - "tests/units"
          - "--cov=src"
          - "--cov-report=lcov:build/coverage.lcov"
          - "--junitxml=build/junit.xml"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages:
          - "pre-push"
          - "pre-commit"
          - "manual"
      - id: mypy
        name: mypy
        entry: "./.venv/bin/mypy"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages:
          - "pre-push"
          - "pre-commit"
          - "manual"
      - id: ruff-format
        name: ruff-format
        language: system
        entry: "./.venv/bin/ruff"
        types: [python]
        pass_filenames: false
        args: ["format", "src", "tests"]
        stages:
          - "pre-push"
          - "pre-commit"
          - "manual"
      - id: ruff-check
        name: ruff-check
        language: system
        entry: "./.venv/bin/ruff"
        types: [python]
        pass_filenames: false
        args: ["check", "src", "tests", "--fix"]
        stages:
          - "pre-push"
          - "pre-commit"
          - "manual"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages:
          - "pre-push"
          - "pre-commit"
          - "manual"
      - id: end-of-file-fixer
        stages:
          - "pre-push"
          - "pre-commit"
          - "manual"
