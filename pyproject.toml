[project]
name = "fastapi_factory_utilities"
dynamic = ["version"]

[tool.poetry]
homepage = "https://github.com/DeerHide/fastapi_factory_utilities"
repository = "https://github.com/DeerHide/fastapi_factory_utilities"
keywords = ["python", "fastapi", "beanie", "taskiq", "opentelemetry", "microservices"]
description = "Consolidate libraries and utilities to create microservices in Python with FastAPI, Beanie, Taskiq, AioPika and OpenTelemetry."
authors = ["miragecentury <victorien.vanroye@gmail.com>"]
maintainers = ["miragecentury <victorien.vanroye@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "fastapi_factory_utilities", from = "src" },
    { include = "fastapi_factory_utilities/py.typed", from = "src" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# ponytail: no [tool.poetry.requires-plugins] — Homebrew Poetry sees nmap's
# ndiff==7.99 on sys.path and pins it into poetry-project-instance, which is
# not on PyPI. Dynamic versioning still works via the build-system backend;
# for CLI injection install: poetry self add "poetry-dynamic-versioning[plugin]"
# (needs a non-brew Poetry, or a Poetry env without brew site-packages).
version = "0.0.0"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
metadata = false
dirty = true

[tool.poetry-dynamic-versioning.substitution]
folders = [{path= "src/fastapi_factory_utilities/core/__init__.py"}]

[[tool.poetry.source]]
name = "velmios"
url = "https://pypi.velmios.io/simple"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
structlog = ">=26.1.0,<27.0"
typer = "^0"
pydantic = "^2.8.2"
fastapi = ">=0.115.13,<0.140.0"
uvicorn = ">=0.51.0,<1"
# ponytail: API + semconv stay mandatory so exceptions/JWT/logging no-op without the SDK.
opentelemetry-api = "^1.43.0"
opentelemetry-semantic-conventions = "^0.64b0"
# ponytail: TaskiqDepends is the FastAPI/worker DI bridge used by core depends.
taskiq = "^0"
pyaml = "^26.7.0"
reactivex = "^4.1.0"
pyjwt = "^2.10.1"
aiohttp = { version="^3.12.13", extras=["speedups"] }
certifi = "^2026.6.17"
fastapi-csrf-protect = "^1.0.7"
cacheout = "^0.16.0"
# mongo extra
beanie = { version = "^2.0.0", optional = true }
pymongo = { version = ">=4.17.0,<4.18.0", extras = ["encryption"], optional = true }
opentelemetry-instrumentation-pymongo = { version = "^0", optional = true }
# amqp extra
aio-pika = { version = "^9.5.7", optional = true }
opentelemetry-instrumentation-aio-pika = { version = "^0.64b0", optional = true }
# s3 extra
aioboto3 = { version = "^15.0.0", optional = true }
opentelemetry-instrumentation-botocore = { version = "^0.64b0", optional = true }
# redis extra
redis = { version = "^8.0", optional = true }
opentelemetry-instrumentation-redis = { version = "^0", optional = true }
# taskiq extra (Redis broker)
taskiq-dependencies = { version="^1.5.8", source="velmios", optional = true }
taskiq-fastapi = { version = "^0.5.0", optional = true }
taskiq-redis = { version = "^1.0.9", optional = true }
# otel extra (SDK / exporters / generic instrumentors)
opentelemetry-sdk = { version = "^1.43.0", optional = true }
opentelemetry-exporter-otlp-proto-http = { version = "^1.43.0", optional = true }
opentelemetry-exporter-otlp-proto-grpc = { version = "^1.43.0", optional = true }
opentelemetry-instrumentation-fastapi = { version = "^0", optional = true }
opentelemetry-propagator-b3 = { version = "^1.43.0", optional = true }
opentelemetry-instrumentation-aiohttp-client = { version = "^0", optional = true }
opentelemetry-instrumentation-requests = { version = "^0", optional = true }
opentelemetry-instrumentation-urllib3 = { version = "^0", optional = true }
opentelemetry-instrumentation-asyncio = { version = "^0", optional = true }
opentelemetry-instrumentation-system-metrics = { version = "^0", optional = true }
opentelemetry-instrumentation-httpx = { version = "^0", optional = true }
psutil = { version = "^7", optional = true }

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
mypy = "^1.10.0"
types-requests = "^2.32.0.20240712"
types-pyyaml = "^6.0.12.20240311"
pylint = {version=">=3.2.2,<5.0.0", extras=["spelling"]}
pre-commit = "^4.6.0"
pyupgrade = "^3.21.2"
pytest = "^9.0.1"
pytest-xdist = "^3.6.1"
pytest-cov = "^7.0.0"
ruff = "^0"
pytest-asyncio = ">=0.25,<1.4"
locust = "^2.45.0"
testcontainers = {version = "^4.9.0", extras = ["mongodb", "rabbitmq", "redis", "minio"]}
types-deprecated = "^1.3.1.20260520"
types-pygments = "^2.20.0.20260518"
types-colorama = "^0.4.15.20260508"
types-protobuf = ">=5.29.1.20241207,<7.0.0.0"
types-psutil = ">=7.2.2.20260518,<8.0.0.0"
types-pyopenssl = "^24.1.0.20240722"
types-ujson = "^5.10.0.20240515"
httpx = "^0.28.1"
minio = "^7"
pymongo-async-mock = "^0.1.3"

[tool.poetry.extras]
mongo = ["beanie", "pymongo", "opentelemetry-instrumentation-pymongo"]
amqp = ["aio-pika", "opentelemetry-instrumentation-aio-pika"]
s3 = ["aioboto3", "opentelemetry-instrumentation-botocore"]
redis = ["redis", "opentelemetry-instrumentation-redis"]
taskiq = ["taskiq-dependencies", "taskiq-fastapi", "taskiq-redis", "redis"]
otel = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-propagator-b3",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-urllib3",
    "opentelemetry-instrumentation-asyncio",
    "opentelemetry-instrumentation-system-metrics",
    "opentelemetry-instrumentation-httpx",
    "psutil",
]
all = [
    "beanie",
    "pymongo",
    "opentelemetry-instrumentation-pymongo",
    "aio-pika",
    "opentelemetry-instrumentation-aio-pika",
    "aioboto3",
    "opentelemetry-instrumentation-botocore",
    "redis",
    "opentelemetry-instrumentation-redis",
    "taskiq-dependencies",
    "taskiq-fastapi",
    "taskiq-redis",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-propagator-b3",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-urllib3",
    "opentelemetry-instrumentation-asyncio",
    "opentelemetry-instrumentation-system-metrics",
    "opentelemetry-instrumentation-httpx",
    "psutil",
]

[tool.poetry.scripts]
fastapi_factory_utilities-example = "fastapi_factory_utilities.example.__main__:main"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "--import-mode=importlib -n auto --color=yes"
filterwarnings = [
    "ignore:.*datetime.datetime.utcfromtimestamp().*:DeprecationWarning", # reactivex
    "ignore:.*datetime.datetime.utcnow().*:DeprecationWarning", # reactivex
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    "ignore:The @wait_container_is_ready decorator is deprecated.*:DeprecationWarning", # testcontainers
    "ignore:The wait_for_logs function with string or callable predicates is deprecated.*:DeprecationWarning", # testcontainers
    "ignore:Remove `format_exc_info` from your processor chain if you want pretty exceptions.*:UserWarning", # structlog pretty exceptions
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/fastapi_factory_utilities"]
omit = ["src/fastapi_factory_utilities/example/*"]

[tool.coverage.report]
fail_under = 89
show_missing = true

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
packages = "fastapi_factory_utilities"
mypy_path  = "src:tests"
namespace_packages = true
plugins = ["pydantic.mypy"]
follow_imports = "silent"
follow_untyped_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
# Same as Black.
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["D","F","E","W","I","UP","PL","N","RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"
