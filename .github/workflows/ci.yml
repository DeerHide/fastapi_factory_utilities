name: CI

on:
  pull_request:
  push:
    # branches: [main] # Disable for now, manual release only
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

defaults:
  run:
    shell: bash

jobs:
  # Setup job to generate the poetry.lock file and upload it as an artifact
  setup:
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      # Resolve poetry.lock at most once per UTC day per pyproject.toml hash.
      - name: Compute UTC date for dependency cache keys
        id: depdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache poetry.lock resolution
        id: lock-cache
        uses: actions/cache@v5.0.3
        with:
          path: poetry.lock
          key: poetry-lock-${{ hashFiles('pyproject.toml') }}-${{ steps.depdate.outputs.date }}
      - name: Cache virtual environment
        id: venv-cache
        uses: actions/cache@v5.0.3
        with:
          path: ./.venv
          key: venv-${{ hashFiles('pyproject.toml') }}-${{ steps.depdate.outputs.date }}
      - name: Configure Poetry virtualenvs
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Resolve dependencies
        if: steps.lock-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry lock
      - name: Install the project dependencies
        if: steps.lock-cache.outputs.cache-hit != 'true' || steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry install --with test
      - name: Upload poetry.lock
        uses: actions/upload-artifact@v7.0.0
        with:
          name: poetry-lock
          path: poetry.lock
  # Job id is part of the dependency-snapshot correlator. Renaming strands the
  # previous manifest under syft; same-detector correlators merge, so stale
  # versions keep generating Dependabot alerts until the orphaned correlator is
  # purged with an empty snapshot.
  dependency-scan:
    needs: setup
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: write
      actions: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download poetry.lock
        uses: actions/download-artifact@v8.0.1
        with:
          name: poetry-lock
      - name: Compute date for cache key
        id: grypedate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache Grype DB
        uses: actions/cache@v5.0.3
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.grypedate.outputs.date }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Generate SBOM with Syft
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          syft --version
          syft ./poetry.lock -o "spdx-json=${REPO_NAME}-sbom.spdx.json" -o "github-json=dependency-snapshot.json"
      # Dependabot reads only the default-branch graph, and syft leaves ref/sha/job
      # empty. Renaming this job changes the correlator and strands the old manifest
      # under detector syft, which keeps stale versions alerting until purged.
      - name: Submit dependency snapshot
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          snap = json.loads(Path("dependency-snapshot.json").read_text())
          snap["sha"] = os.environ["GITHUB_SHA"]
          snap["ref"] = "refs/heads/main"
          snap["job"] = {
              "correlator": f"{os.environ['GITHUB_WORKFLOW']}_{os.environ['GITHUB_JOB']}",
              "id": os.environ["GITHUB_RUN_ID"],
          }
          Path("dependency-snapshot.json").write_text(json.dumps(snap))
          PY
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --data-binary @dependency-snapshot.json
      - name: Scan current project with Grype
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          grype --version
          set +e
          grype "sbom:${REPO_NAME}-sbom.spdx.json" --fail-on high \
            -o "table=${REPO_NAME}-grype-scan.txt" \
            -o "sarif=${REPO_NAME}-grype-scan.sarif"
          GRYPE_EXIT=$?
          set -e
          cat "${REPO_NAME}-grype-scan.txt"
          exit $GRYPE_EXIT
      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.0
        with:
          name: "${{ github.event.repository.name }}-sbom.spdx.json"
          path: "${{ github.event.repository.name }}-sbom.spdx.json"
      - name: Upload Grype text report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: "${{ github.event.repository.name }}-grype-scan.txt"
          path: "${{ github.event.repository.name }}-grype-scan.txt"
      - name: Upload Grype SARIF artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: "${{ github.event.repository.name }}-grype-scan.sarif"
          path: "${{ github.event.repository.name }}-grype-scan.sarif"
  pre-commit:
    needs: setup
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      - name: Download poetry.lock
        uses: actions/download-artifact@v8.0.1
        with:
          name: poetry-lock
      - name: Restore Cache
        uses: actions/cache/restore@v5.0.3
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-
      - uses: actions/cache@v5.0.3
        name: Restore virtualenv
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-
      - name: Setup a local virtual environment
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Install the project dependencies
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry install --with test
      - name: Run pre-commit (formatting, linting, type checking and tests)
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          export PYTHONPATH=./src:./tests:$PYTHONPATH
          poetry run pre-commit run --all-files
  release:
    needs:
      - setup
      - pre-commit
      - dependency-scan
    runs-on: public-actions-runner-scale-set
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write # for the pypi
      contents: write # for the release
      packages: write
      discussions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Download poetry.lock
        uses: actions/download-artifact@v8.0.1
        with:
          name: poetry-lock
      - name: Download SBOM
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ github.event.repository.name }}-sbom.spdx.json"
      - name: Download Grype Scan
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ github.event.repository.name }}-grype-scan.txt"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      - name: Setup a local virtual environment
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Build package distributions
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry self add poetry-dynamic-versioning
          poetry build
      - name: Extract changelog for release
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' \
            > release_notes.txt

          if [ ! -s release_notes.txt ]; then
            echo "No release notes found for ## [$VERSION] in CHANGELOG.md"
            exit 1
          fi

          echo "Extracted release notes for v$VERSION:"
          cat release_notes.txt
      - name: Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          body_path: release_notes.txt
          files: |
            dist/fastapi_factory_utilities-*.tar.gz
            dist/fastapi_factory_utilities-*.whl
            poetry.lock
            ${{ github.event.repository.name }}-sbom.spdx.json
            ${{ github.event.repository.name }}-grype-scan.txt
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          prerelease: false
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
