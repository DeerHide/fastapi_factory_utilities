name: CI

on:
  pull_request:
  push:
    # branches: [main] # Disable for now, manual release only
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

defaults:
  run:
    shell: bash

jobs:
  # Setup job to generate the poetry.lock file and upload it as an artifact
  setup:
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      # Generate poetry.lock file for the CI and upload it as an artifact
      - name: Setup a local virtual environment (if no poetry.toml file)
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
          poetry lock
      - name: Upload poetry.lock
        uses: actions/upload-artifact@v7.0.0
        with:
          name: poetry-lock
          path: poetry.lock
      # Define a cache for the virtual environment based on the dependencies lock file
      # This will speed up the CI by avoiding to reinstall the dependencies if they are already installed
      - uses: actions/cache@v5.0.3
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-
      - name: Install the project dependencies
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry install --with test
  # Job id is part of the dependency-snapshot correlator
  # (CI_<job>_<artifact-name>). Renaming strands the previous manifest under
  # syft; same-detector correlators merge, so stale versions keep generating
  # Dependabot alerts until the orphaned correlator is purged with an empty
  # snapshot.
  dependency-scan:
    needs: setup
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: write
      actions: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download poetry.lock
        uses: actions/download-artifact@v8.0.1
        with:
          name: poetry-lock
      - uses: anchore/sbom-action@v0.24.0
        id: sbom
        with:
          file: ./poetry.lock
          # Snapshot is submitted below against refs/heads/main. The action
          # reads github.context.ref, and runners ignore GITHUB_* env overrides,
          # so dependency-snapshot here would only land on refs/tags/*.
          dependency-snapshot: false
          upload-artifact: true
          upload-artifact-retention: 1
          # softprops/action-gh-release already attaches the SBOM.
          upload-release-assets: false
          format: "spdx-json"
          artifact-name: "${{ github.event.repository.name }}-sbom.spdx.json"
      - name: Submit dependency snapshot for main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import tomllib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib import request

          lock = tomllib.loads(Path("poetry.lock").read_text())
          resolved = {
              pkg["name"]: {
                  "package_url": f"pkg:pypi/{pkg['name']}@{pkg['version']}",
                  "relationship": "direct",
                  "scope": "runtime",
              }
              for pkg in lock["package"]
          }
          artifact = f"{os.environ['GITHUB_REPOSITORY'].split('/', 1)[1]}-sbom.spdx.json"
          correlator = f"{os.environ['GITHUB_WORKFLOW']}_{os.environ['GITHUB_JOB']}_{artifact}"
          snapshot = {
              "version": 0,
              "sha": os.environ["GITHUB_SHA"],
              "ref": "refs/heads/main",
              "job": {
                  "correlator": correlator,
                  "id": os.environ["GITHUB_RUN_ID"],
              },
              # Keep detector.name=syft so this replaces the anchore/sbom-action
              # correlator pair rather than merging a second detector alongside it.
              "detector": {
                  "name": "syft",
                  "version": "ci-poetry-lock",
                  "url": "https://github.com/anchore/syft",
              },
              "scanned": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "manifests": {
                  "poetry.lock": {
                      "name": "poetry.lock",
                      "file": {"source_location": "poetry.lock"},
                      "resolved": resolved,
                  }
              },
          }
          Path("dependency-snapshot.json").write_text(json.dumps(snapshot))
          print(f"correlator={correlator} packages={len(resolved)}")
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --input dependency-snapshot.json
      - name: Download SBOM
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ github.event.repository.name }}-sbom.spdx.json"
      - name: Scan current project
        id: scan
        uses: anchore/scan-action@v7.4.0
        with:
          cache-db: true
          sbom: "${{ github.event.repository.name }}-sbom.spdx.json"
          output-format: table
          output-file: "${{ github.event.repository.name }}-grype-scan.txt"
      - name: Upload Report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: "${{ github.event.repository.name }}-grype-scan.txt"
          path: "${{ github.event.repository.name }}-grype-scan.txt"
  pre-commit:
    needs: setup
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      - name: Download poetry.lock
        uses: actions/download-artifact@v8.0.1
        with:
          name: poetry-lock
      - name: Restore Cache
        uses: actions/cache/restore@v5.0.3
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-
      - uses: actions/cache@v5.0.3
        name: Restore virtualenv
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-
      - name: Setup a local virtual environment
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Install the project dependencies
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry install --with test
      - name: Run pre-commit (formatting, linting, type checking and tests)
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          export PYTHONPATH=./src:./tests:$PYTHONPATH
          poetry run pre-commit run --all-files
  release:
    needs:
      - setup
      - pre-commit
      - dependency-scan
    runs-on: public-actions-runner-scale-set
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write # for the pypi
      contents: write # for the release
      packages: write
      discussions: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Download poetry.lock
        uses: actions/download-artifact@v8.0.1
        with:
          name: poetry-lock
      - name: Download SBOM
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ github.event.repository.name }}-sbom.spdx.json"
      - name: Download Grype Scan
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ github.event.repository.name }}-grype-scan.txt"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      - name: Setup a local virtual environment
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Build package distributions
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry self add poetry-dynamic-versioning
          poetry build
      - name: Extract changelog for release
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' \
            > release_notes.txt

          if [ ! -s release_notes.txt ]; then
            echo "No release notes found for ## [$VERSION] in CHANGELOG.md"
            exit 1
          fi

          echo "Extracted release notes for v$VERSION:"
          cat release_notes.txt
      - name: Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          body_path: release_notes.txt
          files: |
            dist/fastapi_factory_utilities-*.tar.gz
            dist/fastapi_factory_utilities-*.whl
            poetry.lock
            ${{ github.event.repository.name }}-sbom.spdx.json
            ${{ github.event.repository.name }}-grype-scan.txt
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          prerelease: false
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
