name: CI

on:
  pull_request:
  push:
    # branches: [main] # Disable for now, manual release only
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

defaults:
  run:
    shell: bash

jobs:
  # Install from the committed lock. The lock constrains CI; published ranges
  # still constrain consumers. Fresh resolution lives in deps-canary.yml.
  setup:
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      - name: Cache virtual environment
        id: venv-cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
      - name: Configure Poetry virtualenvs
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Check lock is current
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry check --lock
      - name: Install the project dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry install --sync --with test --extras all
  mandatory-only:
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      # ponytail: runner Python has no ensurepip (`python3.12 -m venv` fails).
      # Poetry already works on these nodes; --only main is a no-extras install.
      - name: Create mandatory-only venv
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
          poetry install --sync --only main
      - name: Assert optional backends are absent
        run: poetry run python scripts/assert_mandatory_only.py
      - name: SBOM and Grype mandatory-only
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          # Shared RO Grype DB on the runner mount (no copy into 2Gi tmpfs).
          GRYPE_DB_CACHE_DIR: /var/cache/grype-db
          GRYPE_DB_AUTO_UPDATE: "false"
        run: |
          VENV="$(poetry env info -p)"
          syft "$VENV" -o "spdx-json=${REPO_NAME}-mandatory-sbom.spdx.json"
          set +e
          grype "sbom:${REPO_NAME}-mandatory-sbom.spdx.json" --fail-on high \
            -o "table=${REPO_NAME}-mandatory-grype-scan.txt"
          GRYPE_EXIT=$?
          set -e
          cat "${REPO_NAME}-mandatory-grype-scan.txt"
          exit $GRYPE_EXIT
      - name: Upload mandatory SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: "${{ github.event.repository.name }}-mandatory-sbom.spdx.json"
          path: "${{ github.event.repository.name }}-mandatory-sbom.spdx.json"
      - name: Upload mandatory Grype report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: "${{ github.event.repository.name }}-mandatory-grype-scan.txt"
          path: "${{ github.event.repository.name }}-mandatory-grype-scan.txt"
  # Job id is part of the dependency-snapshot correlator. Renaming strands the
  # previous manifest under syft; same-detector correlators merge, so stale
  # versions keep generating Dependabot alerts until the orphaned correlator is
  # purged with an empty snapshot.
  dependency-scan:
    needs: setup
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: write
      actions: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Generate SBOM with Syft
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          syft --version
          syft ./poetry.lock -o "spdx-json=${REPO_NAME}-sbom.spdx.json" -o "github-json=dependency-snapshot.json"
      # Dependabot reads only the default-branch graph, and syft leaves ref/sha/job
      # empty. Renaming this job changes the correlator and strands the old manifest
      # under detector syft, which keeps stale versions alerting until purged.
      - name: Submit dependency snapshot
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          snap = json.loads(Path("dependency-snapshot.json").read_text())
          snap["sha"] = os.environ["GITHUB_SHA"]
          snap["ref"] = "refs/heads/main"
          snap["job"] = {
              "correlator": f"{os.environ['GITHUB_WORKFLOW']}_{os.environ['GITHUB_JOB']}",
              "id": os.environ["GITHUB_RUN_ID"],
          }
          Path("dependency-snapshot.json").write_text(json.dumps(snap))
          PY
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --data-binary @dependency-snapshot.json
      - name: Scan current project with Grype
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          # Shared RO Grype DB on the runner mount (no copy into 2Gi tmpfs).
          GRYPE_DB_CACHE_DIR: /var/cache/grype-db
          GRYPE_DB_AUTO_UPDATE: "false"
        run: |
          grype --version
          set +e
          # Full lock includes extras; High CVEs in optional backends must not gate
          # unrelated work. The mandatory-only job fails on High for the core install.
          grype "sbom:${REPO_NAME}-sbom.spdx.json" \
            -o "table=${REPO_NAME}-grype-scan.txt" \
            -o "sarif=${REPO_NAME}-grype-scan.sarif"
          GRYPE_EXIT=$?
          set -e
          cat "${REPO_NAME}-grype-scan.txt"
          exit $GRYPE_EXIT
      - name: Upload SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: "${{ github.event.repository.name }}-sbom.spdx.json"
          path: "${{ github.event.repository.name }}-sbom.spdx.json"
      - name: Upload Grype text report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: "${{ github.event.repository.name }}-grype-scan.txt"
          path: "${{ github.event.repository.name }}-grype-scan.txt"
      - name: Upload Grype SARIF artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: "${{ github.event.repository.name }}-grype-scan.sarif"
          path: "${{ github.event.repository.name }}-grype-scan.sarif"
  pre-commit:
    needs: setup
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      - name: Restore Cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        name: Restore virtualenv
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-
      - name: Setup a local virtual environment
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Install the project dependencies
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry install --sync --with test --extras all
      - name: Run pre-commit (formatting, linting, type checking and tests)
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          export PYTHONPATH=./src:./tests:$PYTHONPATH
          poetry run pre-commit run --all-files
  release:
    needs:
      - setup
      - pre-commit
      - dependency-scan
      - mandatory-only
    runs-on: public-actions-runner-scale-set
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write # for the pypi
      contents: write # for the release
      packages: write
      discussions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: "${{ github.event.repository.name }}-sbom.spdx.json"
      - name: Download Grype Scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: "${{ github.event.repository.name }}-grype-scan.txt"
      - name: Verify runner Python and Poetry toolchain
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          python3.12 --version
          poetry --version
          uv --version
      - name: Setup a local virtual environment
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Build package distributions
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry self add poetry-dynamic-versioning
          poetry build
      - name: Extract changelog for release
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' \
            > release_notes.txt

          if [ ! -s release_notes.txt ]; then
            echo "No release notes found for ## [$VERSION] in CHANGELOG.md"
            exit 1
          fi

          echo "Extracted release notes for v$VERSION:"
          cat release_notes.txt
      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body_path: release_notes.txt
          files: |
            dist/fastapi_factory_utilities-*.tar.gz
            dist/fastapi_factory_utilities-*.whl
            poetry.lock
            ${{ github.event.repository.name }}-sbom.spdx.json
            ${{ github.event.repository.name }}-grype-scan.txt
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          prerelease: false
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
