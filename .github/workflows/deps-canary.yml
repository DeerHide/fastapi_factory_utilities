# Weekly fresh resolve of main. Pull-request CI also resolves from
# pyproject.toml (no committed lock). This job repeats that outside a
# review so upstream breakage on main is visible on a schedule.
name: Dependency canary

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: public-actions-runner-scale-set
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Ensure Poetry and uv are on PATH
        run: echo "/home/runner/.local/bin" >> "$GITHUB_PATH"
      - name: Configure Poetry virtualenvs
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - name: Resolve dependencies fresh
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          rm -f poetry.lock
          poetry lock
          poetry install --with test --extras all
      - name: Run unit suite
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          export PYTHONPATH=./src:./tests:$PYTHONPATH
          poetry run pytest tests/units
